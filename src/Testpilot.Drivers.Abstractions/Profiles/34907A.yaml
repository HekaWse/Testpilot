# Keysight 34907A multifunction module (digital I/O, totalizer, DAC) for the 34970A.
# Source: Keysight 34970A/34972A User's Guide 9018-02644 (pages 162-169).
id: agilent-34970a-34907a
model: "34970A with 34907A module"
