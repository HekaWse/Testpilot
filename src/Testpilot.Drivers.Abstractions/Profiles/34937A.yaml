specialCases:
  - "28 Form-C-Relais (SPDT, COM/NO/NC) auf Kanal 1-28 und 4 Form-A-Relais (SPST) auf Kanal 29-32, alle bistabil (User's Guide S. 15, 22)."
  - "Keine Verbindung zu den Analog-Bussen des 34980A: keine Messungen über dieses Modul (S. 15)."
  - "Mehrere Kanäle dürfen gleichzeitig geschlossen sein (S. 15)."
  - "Form C (Kanal 1-28): 1 A schalten / 2 A tragen, 60 VA pro Kanal; Verschmutzungsgrad 1: ±300 Vrms/VDC, Grad 2: ±100 Vrms/VDC (S. 42)."
  - "Form A (Kanal 29-32): 5 A schalten / 7 A tragen, 150 VA pro Kanal; Verschmutzungsgrad 1: ±250 Vrms oder 30 VDC, Grad 2: ±100 Vrms oder 30 VDC (S. 42)."
  - "Max. 6 W Verlustleistung pro Modul; Transienten 1000 Vpk (S. 42-43)."
  - "Verhalten der 5-A-Relais bei Netzausfall über Jumper (Werkseinstellung: Zustand halten); Abfrage mit SYSTem:MODule:PFAil:JUMPer:AMP5? <slot> (S. 17, 20)."
  - "Temperatursensor meldet ab 70 °C HOT/SRQ (S. 16)."
