specialCases:
  - "Zwei Bänke mit je 10 Kanälen: Kanal 1-10 (Bank 1), 11-20 (Bank 2), dazu zwei abgesicherte Stromkanäle 21 und 22 (User's Guide S. 210)."
  - "4-Draht (FRES) nur auf Kanal 1-10: das Gerät koppelt Kanal n (Source) automatisch mit Kanal n+10 (Sense) (S. 39, 210, 212)."
  - "Strommessung (DC/AC, Bereiche 10 mA, 100 mA, 1 A) nur auf Kanal 21 und 22 (S. 39, 145)."
  - "Nur einer der Kanäle 21 und 22 kann gleichzeitig mit dem DMM/Com verbunden sein; das Schließen des einen schließt den anderen (Eingang I nach LO kurzgeschlossen) (S. 211)."
  - "Sind Kanäle in der Scanliste (der Treiber misst mit ROUT:SCAN), lassen sich nicht mehrere Kanäle schließen: das Schließen eines Kanals öffnet den zuvor geschlossenen (S. 211)."
  - "Grenzen: max. 300 V (CAT I), 1 A, 50 W Schaltleistung (S. 212)."
  - "Messbereiche des internen DMM: Spannung 100 mV-300 V, Widerstand 100 Ω-100 MΩ (S. 39); sie sind im Modulprofil nicht begrenzt."
  - "Messungen setzen das (optionale) interne DMM des 34970A voraus (S. 125)."
