# Keysight 34901A 20-channel multiplexer with 2 current channels for the 34970A.
# Source: Keysight 34970A/34972A User's Guide 9018-02644 (pages 39, 125, 145, 210-212).
id: agilent-34970a-34901a
model: "34970A with 34901A module"
channelCount: 22
channelNumbering: "module channel 1..22; in the 34970A: slot * 100 + channel (for example 103 = slot 1 channel 3)"
capabilities: [SwitchMultimeter]
# The 34970A keeps the measurement configuration per channel (CONF ... ,(@scc)).
# Relay commands are treated conservatively: they invalidate the configuration of the channel.
state:
  settings: [function, range, nplc]
  invalidatedByCommand:
    relay: ["*"]
    configure: []
    measure: []
  unknownCommandInvalidatesAll: true
