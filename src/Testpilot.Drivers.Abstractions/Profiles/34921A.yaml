model: "34980A with 34921A module"
channelCount: 44
channelNumbering: "module channel 1..44; in the 34980A: slot * 1000 + channel (sccc, for example 1003 = slot 1 channel 3)"
capabilities: [SwitchMultimeter]
# The 34980A keeps the measurement configuration per channel (CONF ... ,(@sccc)).
# Relay commands are treated conservatively: they invalidate the configuration of the channel.
state:
  settings: [function, range, nplc]
  invalidatedByCommand:
    relay: ["*"]
    configure: []
    measure: []
  unknownCommandInvalidatesAll: true
