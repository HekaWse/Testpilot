specialCases:
  - "Zwei Bänke mit je 20 Armature-Relais: Kanal 1-20 (Bank 1), 21-40 (Bank 2) (User's Guide S. 25)."
  - "4-Draht (FRES) nur auf Kanal 1-20: das Gerät koppelt Kanal n (Source) automatisch mit Kanal n+20 (Sense) (S. 25)."
  - "Direkte Strommessung (AC/DC) nur auf den abgesicherten Kanälen 41-44, make-before-break; andere Kanäle brauchen externe Shunts (S. 18, 25)."
  - "Strom und Spannung können auf ABus1 nicht gleichzeitig gemessen werden (S. 25)."
  - "Analog-Bus-Relais 911-914, 921-924 und 931 (931 = Stromeingang des DMM) sind keine Messkanäle und hier nicht als Kanäle geführt (S. 25)."
  - "Safety-Interlock: Pins 17 und 33 der D-Sub-Stecker von Bank 1 und Bank 2 müssen gebrückt sein, sonst öffnen die Analog-Bus-Relais (S. 19, 27)."
  - "Läuft ein Scan, führt das Schließen eines weiteren Kanals derselben Bank zu einem Fehler (S. 21)."
  - "Grenzen Verschmutzungsgrad 1: ±300 Vrms/VDC; Verschmutzungsgrad 2: ±100 Vrms/VDC; 1 A schalten / 2 A tragen; 60 VA pro Kanal; max. 6 W Verlustleistung pro Modul; Transienten 1000 Vpk (S. 86-87)."
  - "Die Messbereiche gehören zum internen DMM des 34980A und sind im Modulprofil nicht begrenzt."
  - "Sicherungswerte der Stromkanäle stehen nur im 34980A Service Guide (S. 25)."
